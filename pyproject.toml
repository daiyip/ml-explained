[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlexp"
version = "0.1.0"
description = "Shared helpers for the transformer-explained notebooks"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "matplotlib"]

[tool.setuptools]
packages = ["mlexp"]
