site_name: Machine Learning Explained
site_description: "Machine Learning Explained: the modern Transformer, one building block at a time."
site_url: https://ml.daiyip.com/
repo_url: https://github.com/daiyip/ml-explained
docs_dir: chapters

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js
  - assets/extra.js
  - assets/tree.js

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - tables
  - admonition
  - attr_list

nav:
  - Home: index.md
  - "Part I · Anatomy":
      - "1. Anatomy of a modern Transformer": 01-anatomy/index.ipynb
  - "Part II · Architecture":
      - "2. Tokens and embeddings": 02-tokens/index.ipynb
      - "3. Position encoding": 03-position/index.ipynb
      - "4. Token mixing": 04-token-mixing/index.ipynb
      - "5. Channel mixing": 05-channel-mixing/index.ipynb
      - "6. Normalization": 06-normalization/index.ipynb
      - "7. Residual connections": 07-residual/index.ipynb
  - "Part III · Training recipe":
      - "8. Objective and loss": 08-objective/index.ipynb
      - "9. Optimizer": 09-optimizer/index.ipynb
      - "10. Learning-rate schedule": 10-lr-schedule/index.ipynb
      - "11. Initialization": 11-initialization/index.ipynb
