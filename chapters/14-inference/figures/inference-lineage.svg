<svg xmlns="http://www.w3.org/2000/svg" class="inf-fig" viewBox="0 0 960 600" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .inf-fig .t{fill:var(--mlx-ink,#131c27)} .inf-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .inf-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .inf-fig .e,.inf-fig .e2,.inf-fig .e3,.inf-fig .ed{fill:none;stroke-width:1.5} .inf-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .inf-fig .ed{stroke:var(--mlx-ink-soft,#4a5868);stroke-dasharray:3 4;opacity:.6} .inf-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .inf-fig .e3{stroke:var(--mlx-warn,#b5562b)} .inf-fig .thick{stroke-width:3;stroke-linecap:round} .inf-fig .thin{stroke-width:1.3} .inf-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .inf-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .inf-fig .n1,.inf-fig .n2,.inf-fig .n3{stroke-width:2} .inf-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .inf-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .inf-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .inf-fig .dash{stroke-dasharray:5 4;stroke-width:1.5} .inf-fig .tag1{fill:var(--mlx-accent,#2647c9)} .inf-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .inf-fig .tag3{fill:var(--mlx-warn,#b5562b)} .inf-fig .tagt1,.inf-fig .tagt2,.inf-fig .tagt3{fill:var(--mlx-paper,#fff)} .inf-fig .bar{fill:var(--mlx-accent,#2647c9)} .inf-fig .bar0{fill:var(--mlx-ink-soft,#4a5868);opacity:.35} .inf-fig .cut{stroke:var(--mlx-accent,#2647c9);stroke-width:1.5;stroke-dasharray:4 3} .inf-fig .cl1{fill:var(--mlx-accent,#2647c9)} .inf-fig .node{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-width:1.25} .inf-fig .line{fill:var(--mlx-ink-soft,#4a5868);opacity:.3}
</style>
<defs><marker id="inf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. Decoding</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">one token per forward pass</text>
<g transform="translate(0,40)">
<rect x="50" y="446" width="150" height="50" rx="8" class="n1 dash"/>
<rect x="58.0" y="452" width="40" height="26" rx="6" class="b"/>
