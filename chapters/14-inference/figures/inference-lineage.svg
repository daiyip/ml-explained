<rect x="196" y="307.6" width="20" height="8.4" rx="2" class="bar0"/>
<text x="206" y="331" class="q" font-size="12.1" font-weight="400" text-anchor="middle">a</text>
<rect x="226" y="309.0" width="20" height="7.0" rx="2" class="bar0"/>
<text x="236" y="331" class="q" font-size="12.1" font-weight="400" text-anchor="middle">we</text>
<path d="M161 246 V316" class="cut"/>
<text x="165" y="256" class="cl1" font-size="11.5" font-weight="600" text-anchor="start">top-p cut</text>
<path d="M160 216 V190" class="e" marker-end="url(#inf-a)"/>
<rect x="40.0" y="142" width="240" height="48" rx="8" class="b"/>
<text x="160" y="163" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Pick one token</text>
<text x="160" y="180" class="q" font-size="13.8" font-weight="400" text-anchor="middle">greedy, or sample at temperature T</text>
<path d="M160 142 V104" class="e" marker-end="url(#inf-a)"/>
<text x="160" y="96" class="q" font-size="13.8" font-weight="400" text-anchor="middle">append it, then repeat</text>
<text x="160" y="540" class="q" font-size="14.4" font-weight="400" text-anchor="middle">serial steps per answer: L</text>
</g>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. Chain of thought</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">write the steps before the answer</text>
