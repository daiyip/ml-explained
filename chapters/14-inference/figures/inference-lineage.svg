<rect x="105.0" y="452" width="40" height="26" rx="6" class="b"/>
<text x="125" y="470.0" class="t" font-size="14.4" font-weight="600" text-anchor="middle">be</text>
<rect x="152.0" y="452" width="40" height="26" rx="6" class="b"/>
<text x="172" y="470.0" class="t" font-size="14.4" font-weight="600" text-anchor="middle">or</text>
<rect x="210.0" y="452" width="48" height="26" rx="6" class="b"/>
<text x="234" y="470.0" class="t" font-size="14.4" font-weight="600" text-anchor="middle">not</text>
<text x="125" y="514" class="cl1" font-size="12.1" font-weight="600" text-anchor="middle">KV cache: kept, not recomputed</text>
<text x="240" y="514" class="q" font-size="12.1" font-weight="400" text-anchor="middle">new</text>
