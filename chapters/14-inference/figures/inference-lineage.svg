<text x="160" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Transformer</text>
<text x="160" y="410" class="q" font-size="13.8" font-weight="400" text-anchor="middle">one pass for the new token only</text>
<path d="M160 372 V346" class="e" marker-end="url(#inf-a)"/>
<rect x="50" y="216" width="220" height="128" rx="8" class="n1"/>
