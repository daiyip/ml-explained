<text x="70" y="164" class="cl3" font-size="12.1" font-weight="600" text-anchor="start">too large: explodes</text>
<text x="260" y="237.0" class="cl1" font-size="12.1" font-weight="600" text-anchor="end">fan-in scaled: flat</text>
<text x="70" y="332" class="q" font-size="12.1" font-weight="400" text-anchor="start">too small: vanishes</text>
<text x="160" y="392" class="q" font-size="14.4" font-weight="400" text-anchor="middle">forward signal and backward</text>
<text x="160" y="410" class="q" font-size="14.4" font-weight="400" text-anchor="middle">gradient both keep their scale</text>
<rect x="42.0" y="436" width="236" height="50" rx="8" class="b"/>
<text x="160" y="457" class="t" font-size="16.1" font-weight="600" text-anchor="middle">ReLU zeroes half the units</text>
<text x="160" y="474" class="q" font-size="13.8" font-weight="400" text-anchor="middle">so He doubles Xavier's variance</text>
</g>
