<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. Xavier and He init</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">2010 and 2015</text>
<g transform="translate(0,40)">
