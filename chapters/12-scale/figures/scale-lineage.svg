<text x="160" y="540" class="q" font-size="14.4" font-weight="400" text-anchor="middle">the same block, just bigger</text>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. Chinchilla</text>
