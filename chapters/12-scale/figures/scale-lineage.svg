<text x="480" y="540" class="q" font-size="14.4" font-weight="400" text-anchor="middle">same compute, smaller model, more data</text>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. In-context learning</text>
