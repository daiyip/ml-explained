<text x="160" y="417" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Token ids</text>
<text x="160" y="434" class="q" font-size="13.8" font-weight="400" text-anchor="middle">(B, T) integers</text>
<path d="M160 396 V366" class="e" marker-end="url(#ana-a)"/>
<rect x="60" y="252" width="200" height="112" rx="8" class="n1"/>
