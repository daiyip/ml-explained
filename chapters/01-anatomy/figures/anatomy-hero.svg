<text x="502" y="432" class="t" font-size="16.1" font-weight="600" text-anchor="middle">RMSNorm</text>
<path d="M502 410 V384" class="e" marker-end="url(#ana-a)"/>
<rect x="427.0" y="330" width="150" height="52" rx="8" class="n2"/>
<text x="502" y="351" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Attention</text>
<text x="502" y="368" class="q" font-size="13.8" font-weight="400" text-anchor="middle">mixes across tokens</text>
<path d="M502 330 V304 H406" class="e" marker-end="url(#ana-a)"/>
<circle cx="392" cy="304" r="12" class="n2"/>
<text x="392" y="309" class="t" font-size="17.2" font-weight="600" text-anchor="middle">+</text>
<path d="M392 282 H502 V258" class="e" marker-end="url(#ana-a)"/>
<rect x="427.0" y="222" width="150" height="34" rx="8" class="b"/>
<text x="502" y="244" class="t" font-size="16.1" font-weight="600" text-anchor="middle">RMSNorm</text>
<path d="M502 222 V196" class="e" marker-end="url(#ana-a)"/>
<rect x="427.0" y="142" width="150" height="52" rx="8" class="n2"/>
<text x="502" y="163" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Feed-forward</text>
<text x="502" y="180" class="q" font-size="13.8" font-weight="400" text-anchor="middle">transforms each token</text>
<path d="M502 142 V122 H406" class="e" marker-end="url(#ana-a)"/>
<circle cx="392" cy="122" r="12" class="n2"/>
<text x="392" y="127" class="t" font-size="17.2" font-weight="600" text-anchor="middle">+</text>
<text x="392" y="98" class="q" font-size="12.6" font-weight="400" text-anchor="middle">to the next block</text>
<text x="390" y="404" class="cl2" font-size="12.1" font-weight="600" text-anchor="end">residual</text>
</g>
<text x="480" y="588" class="q" font-size="14.4" font-weight="400" text-anchor="middle">norm and residual keep a deep stack trainable</text>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. Two ends</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">same blocks, text or images</text>
<g transform="translate(0,40)">
<rect x="670.0" y="448" width="124" height="48" rx="8" class="b"/>
<text x="732" y="469" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Characters</text>
<text x="732" y="486" class="q" font-size="13.8" font-weight="400" text-anchor="middle">token embedding</text>
<rect x="806.0" y="448" width="124" height="48" rx="8" class="b"/>
<text x="868" y="469" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Image patches</text>
<text x="868" y="486" class="q" font-size="13.8" font-weight="400" text-anchor="middle">4×4 pixels each</text>
<path d="M732 448 V420" class="e" marker-end="url(#ana-a)"/>
<path d="M868 448 V420" class="e" marker-end="url(#ana-a)"/>
<rect x="668" y="296" width="264" height="122" rx="8" class="n3"/>
<text x="800" y="318" class="t" font-size="16.1" font-weight="600" text-anchor="middle">The same N blocks</text>
<rect x="708" y="330" width="184" height="16" rx="4" class="b"/>
<rect x="708" y="352" width="184" height="16" rx="4" class="b"/>
<rect x="708" y="374" width="184" height="16" rx="4" class="b"/>
<text x="732" y="410" class="cl3" font-size="12.1" font-weight="600" text-anchor="middle">causal mask</text>
<text x="868" y="410" class="cl3" font-size="12.1" font-weight="600" text-anchor="middle">no mask</text>
<path d="M732 296 V268" class="e" marker-end="url(#ana-a)"/>
<path d="M868 296 V268" class="e" marker-end="url(#ana-a)"/>
<rect x="670.0" y="220" width="124" height="48" rx="8" class="b"/>
<text x="732" y="241" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Next-token</text>
<text x="732" y="258" class="q" font-size="13.8" font-weight="400" text-anchor="middle">logits per position</text>
<rect x="806.0" y="220" width="124" height="48" rx="8" class="b"/>
<text x="868" y="241" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Class logits</text>
<text x="868" y="258" class="q" font-size="13.8" font-weight="400" text-anchor="middle">pooled patches</text>
<path d="M732 220 V186" class="e" marker-end="url(#ana-a)"/>
<path d="M868 220 V186" class="e" marker-end="url(#ana-a)"/>
<text x="732" y="176" class="q" font-size="13.8" font-weight="400" text-anchor="middle">language model</text>
<text x="868" y="176" class="q" font-size="13.8" font-weight="400" text-anchor="middle">Vision Transformer</text>
</g>
<text x="800" y="588" class="q" font-size="14.4" font-weight="400" text-anchor="middle">only the input and output change</text>
<rect x="77.55" y="73" width="164.9" height="19" rx="9.5" class="tag1"/>
<text x="160" y="87" class="tagt1" font-size="12.1" font-weight="600" text-anchor="middle">NEW: ids become vectors</text>
<rect x="381.8" y="73" width="196.4" height="19" rx="9.5" class="tag2"/>
<text x="480" y="87" class="tagt2" font-size="12.1" font-weight="600" text-anchor="middle">NEW: mix across, then within</text>
<rect x="679.75" y="73" width="240.5" height="19" rx="9.5" class="tag3"/>
<text x="800" y="87" class="tagt3" font-size="12.1" font-weight="600" text-anchor="middle">NEW: swap the ends, keep the blocks</text>
<path d="M320 20 V600" class="sep"/>
<path d="M640 20 V600" class="sep"/>
</svg>
