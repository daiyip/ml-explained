<svg xmlns="http://www.w3.org/2000/svg" class="ana-fig" viewBox="0 0 960 620" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .ana-fig .t{fill:var(--mlx-ink,#131c27)} .ana-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .ana-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .ana-fig .off{opacity:.55} .ana-fig .e,.ana-fig .e2,.ana-fig .e3,.ana-fig .ed{fill:none;stroke-width:1.5} .ana-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .ana-fig .ed{stroke:var(--mlx-ink-soft,#4a5868);stroke-dasharray:3 4;opacity:.6} .ana-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .ana-fig .e3{stroke:var(--mlx-warn,#b5562b)} .ana-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .ana-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .ana-fig .n1,.ana-fig .n2,.ana-fig .n3{stroke-width:2} .ana-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .ana-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .ana-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .ana-fig .tag1{fill:var(--mlx-accent,#2647c9)} .ana-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .ana-fig .tag3{fill:var(--mlx-warn,#b5562b)} .ana-fig .tagt1,.ana-fig .tagt2,.ana-fig .tagt3{fill:var(--mlx-paper,#fff)} .ana-fig .res{stroke-width:3;opacity:.8} .ana-fig .cell{fill:var(--mlx-ink-soft,#4a5868);opacity:.18} .ana-fig .cell1{fill:var(--mlx-accent,#2647c9);opacity:.75} .ana-fig .cl2{fill:var(--mlx-good,#1f8a5b)} .ana-fig .cl3{fill:var(--mlx-warn,#b5562b)}
</style>
<defs><marker id="ana-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. Into vectors</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">tokens, embedding, position</text>
<g transform="translate(0,40)">
<rect x="65" y="470" width="30" height="26" rx="6" class="b"/>
<text x="80" y="488" class="t" font-size="13.8" font-weight="600" text-anchor="middle">T</text>
<rect x="105" y="470" width="30" height="26" rx="6" class="b"/>
<text x="120" y="488" class="t" font-size="13.8" font-weight="600" text-anchor="middle">o</text>
<rect x="145" y="470" width="30" height="26" rx="6" class="b"/>
<text x="160" y="488" class="t" font-size="13.8" font-weight="600" text-anchor="middle">␣</text>
