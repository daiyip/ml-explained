<rect x="192" y="326" width="14" height="11" rx="2" class="cell"/>
<rect x="208" y="326" width="14" height="11" rx="2" class="cell"/>
<text x="160" y="352" class="q" font-size="12.1" font-weight="400" text-anchor="middle">one row of d numbers per id</text>
<path d="M160 252 V226" class="e" marker-end="url(#ana-a)"/>
<rect x="60.0" y="178" width="200" height="48" rx="8" class="b"/>
<text x="160" y="199" class="t" font-size="16.1" font-weight="600" text-anchor="middle">RoPE</text>
<text x="160" y="216" class="q" font-size="13.8" font-weight="400" text-anchor="middle">rotate q and k by position</text>
<path d="M160 178 V136" class="e" marker-end="url(#ana-a)"/>
<text x="160" y="128" class="q" font-size="13.8" font-weight="400" text-anchor="middle">(B, T, d) vectors</text>
</g>
<text x="160" y="588" class="q" font-size="14.4" font-weight="400" text-anchor="middle">order enters only through position</text>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. One block</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">repeated N times</text>
<g transform="translate(0,40)">
<text x="480" y="512" class="q" font-size="13.8" font-weight="400" text-anchor="middle">x: the residual stream</text>
<path d="M392 496 V318" class="e2 res"/>
<path d="M392 292 V136" class="e2 res"/>
