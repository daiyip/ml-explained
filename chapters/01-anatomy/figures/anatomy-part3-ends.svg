<svg xmlns="http://www.w3.org/2000/svg" class="ana3-fig" viewBox="646 196 308 408" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .ana3-fig .t{fill:var(--mlx-ink,#131c27)} .ana3-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .ana3-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .ana3-fig .off{opacity:.55} .ana3-fig .e,.ana3-fig .e2,.ana3-fig .e3,.ana3-fig .ed{fill:none;stroke-width:1.5} .ana3-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .ana3-fig .ed{stroke:var(--mlx-ink-soft,#4a5868);stroke-dasharray:3 4;opacity:.6} .ana3-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .ana3-fig .e3{stroke:var(--mlx-warn,#b5562b)} .ana3-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .ana3-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .ana3-fig .n1,.ana3-fig .n2,.ana3-fig .n3{stroke-width:2} .ana3-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .ana3-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .ana3-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .ana3-fig .tag1{fill:var(--mlx-accent,#2647c9)} .ana3-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .ana3-fig .tag3{fill:var(--mlx-warn,#b5562b)} .ana3-fig .tagt1,.ana3-fig .tagt2,.ana3-fig .tagt3{fill:var(--mlx-paper,#fff)} .ana3-fig .res{stroke-width:3;opacity:.8} .ana3-fig .cell{fill:var(--mlx-ink-soft,#4a5868);opacity:.18} .ana3-fig .cell1{fill:var(--mlx-accent,#2647c9);opacity:.75} .ana3-fig .cl2{fill:var(--mlx-good,#1f8a5b)} .ana3-fig .cl3{fill:var(--mlx-warn,#b5562b)}
</style>
<defs><marker id="ana3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. Two ends</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">same blocks, text or images</text>
<g transform="translate(0,40)">
<rect x="670.0" y="448" width="124" height="48" rx="8" class="b"/>
<text x="732" y="469" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Characters</text>
<text x="732" y="486" class="q" font-size="13.8" font-weight="400" text-anchor="middle">token embedding</text>
<rect x="806.0" y="448" width="124" height="48" rx="8" class="b"/>
<text x="868" y="469" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Image patches</text>
<text x="868" y="486" class="q" font-size="13.8" font-weight="400" text-anchor="middle">4×4 pixels each</text>
<path d="M732 448 V420" class="e" marker-end="url(#ana3-a)"/>
<path d="M868 448 V420" class="e" marker-end="url(#ana3-a)"/>
<rect x="668" y="296" width="264" height="122" rx="8" class="n3"/>
<text x="800" y="318" class="t" font-size="16.1" font-weight="600" text-anchor="middle">The same N blocks</text>
<rect x="708" y="330" width="184" height="16" rx="4" class="b"/>
<rect x="708" y="352" width="184" height="16" rx="4" class="b"/>
<rect x="708" y="374" width="184" height="16" rx="4" class="b"/>
<text x="732" y="410" class="cl3" font-size="12.1" font-weight="600" text-anchor="middle">causal mask</text>
<text x="868" y="410" class="cl3" font-size="12.1" font-weight="600" text-anchor="middle">no mask</text>
<path d="M732 296 V268" class="e" marker-end="url(#ana3-a)"/>
<path d="M868 296 V268" class="e" marker-end="url(#ana3-a)"/>
<rect x="670.0" y="220" width="124" height="48" rx="8" class="b"/>
<text x="732" y="241" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Next-token</text>
<text x="732" y="258" class="q" font-size="13.8" font-weight="400" text-anchor="middle">logits per position</text>
<rect x="806.0" y="220" width="124" height="48" rx="8" class="b"/>
<text x="868" y="241" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Class logits</text>
