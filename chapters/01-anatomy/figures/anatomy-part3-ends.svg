<path d="M732 220 V186" class="e" marker-end="url(#ana3-a)"/>
<path d="M868 220 V186" class="e" marker-end="url(#ana3-a)"/>
<text x="732" y="176" class="q" font-size="13.8" font-weight="400" text-anchor="middle">language model</text>
<text x="868" y="176" class="q" font-size="13.8" font-weight="400" text-anchor="middle">Vision Transformer</text>
</g>
<text x="800" y="588" class="q" font-size="14.4" font-weight="400" text-anchor="middle">only the input and output change</text>
