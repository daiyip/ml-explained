<svg xmlns="http://www.w3.org/2000/svg" class="ana2-fig" viewBox="326 124 308 480" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .ana2-fig .t{fill:var(--mlx-ink,#131c27)} .ana2-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .ana2-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .ana2-fig .off{opacity:.55} .ana2-fig .e,.ana2-fig .e2,.ana2-fig .e3,.ana2-fig .ed{fill:none;stroke-width:1.5} .ana2-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .ana2-fig .ed{stroke:var(--mlx-ink-soft,#4a5868);stroke-dasharray:3 4;opacity:.6} .ana2-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .ana2-fig .e3{stroke:var(--mlx-warn,#b5562b)} .ana2-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .ana2-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .ana2-fig .n1,.ana2-fig .n2,.ana2-fig .n3{stroke-width:2} .ana2-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .ana2-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .ana2-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .ana2-fig .tag1{fill:var(--mlx-accent,#2647c9)} .ana2-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .ana2-fig .tag3{fill:var(--mlx-warn,#b5562b)} .ana2-fig .tagt1,.ana2-fig .tagt2,.ana2-fig .tagt3{fill:var(--mlx-paper,#fff)} .ana2-fig .res{stroke-width:3;opacity:.8} .ana2-fig .cell{fill:var(--mlx-ink-soft,#4a5868);opacity:.18} .ana2-fig .cell1{fill:var(--mlx-accent,#2647c9);opacity:.75} .ana2-fig .cl2{fill:var(--mlx-good,#1f8a5b)} .ana2-fig .cl3{fill:var(--mlx-warn,#b5562b)}
</style>
<defs><marker id="ana2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. One block</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">repeated N times</text>
