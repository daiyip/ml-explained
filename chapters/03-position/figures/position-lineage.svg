<svg xmlns="http://www.w3.org/2000/svg" class="pos-fig" viewBox="0 0 960 600" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .pos-fig .t{fill:var(--mlx-ink,#131c27)} .pos-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .pos-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .pos-fig .e,.pos-fig .e1,.pos-fig .e2,.pos-fig .e3{fill:none;stroke-width:1.5} .pos-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .pos-fig .e1{stroke:var(--mlx-accent,#2647c9)} .pos-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .pos-fig .e3{stroke:var(--mlx-warn,#b5562b)} .pos-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .pos-fig .ah3{fill:var(--mlx-warn,#b5562b)} .pos-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .pos-fig .n1,.pos-fig .n2,.pos-fig .n3{stroke-width:2} .pos-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .pos-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .pos-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .pos-fig .cell{fill:var(--mlx-good,#1f8a5b)} .pos-fig .dial{fill:none;stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.5;stroke-dasharray:3 3} .pos-fig .vq,.pos-fig .vk{fill:none;stroke-width:2.2;stroke-linecap:round} .pos-fig .vq{stroke:var(--mlx-warn,#b5562b)} .pos-fig .vk{stroke:var(--mlx-ink,#131c27)} .pos-fig .arc{fill:none;stroke:var(--mlx-warn,#b5562b);stroke-width:1.5} .pos-fig .tag1{fill:var(--mlx-accent,#2647c9)} .pos-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .pos-fig .tag3{fill:var(--mlx-warn,#b5562b)} .pos-fig .tagt1,.pos-fig .tagt2,.pos-fig .tagt3{fill:var(--mlx-paper,#fff)}
</style>
<defs><marker id="pos-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="pos-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah3"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. Absolute</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">sinusoidal 2017, learned 2018</text>
<g transform="translate(0,40)">
<rect x="50.0" y="452" width="104" height="48" rx="8" class="b"/>
<text x="102" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">token</text>
<text x="102" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">embedding</text>
<rect x="166.0" y="452" width="104" height="48" rx="8" class="n1"/>
<text x="218" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">position i</text>
<text x="218" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">sin/cos or table</text>
<path d="M102 452 V420 H146" class="e" marker-end="url(#pos-a)"/>
<path d="M218 452 V420 H174" class="e1" marker-end="url(#pos-a)"/>
<circle cx="160" cy="420" r="12" class="n1"/>
<text x="160" y="425" class="t" font-size="17.2" font-weight="600" text-anchor="middle">+</text>
<path d="M160 408 V372" class="e" marker-end="url(#pos-a)"/>
<rect x="60.0" y="324" width="200" height="48" rx="8" class="b"/>
<text x="160" y="345" class="t" font-size="16.1" font-weight="600" text-anchor="middle">q, k carry position</text>
<text x="160" y="362" class="q" font-size="13.8" font-weight="400" text-anchor="middle">mixed into the content</text>
<path d="M160 324 V292" class="e" marker-end="url(#pos-a)"/>
<rect x="60.0" y="244" width="200" height="48" rx="8" class="b"/>
<text x="160" y="265" class="t" font-size="16.1" font-weight="600" text-anchor="middle">score q·k</text>
<text x="160" y="282" class="q" font-size="13.8" font-weight="400" text-anchor="middle">content and position tangled</text>
<path d="M160 244 V212" class="e" marker-end="url(#pos-a)"/>
<rect x="60.0" y="164" width="200" height="34" rx="8" class="b"/>
<text x="160" y="186" class="t" font-size="16.1" font-weight="600" text-anchor="middle">softmax, weight v</text>
<path d="M160 164 V132" class="e" marker-end="url(#pos-a)"/>
<text x="160" y="120" class="q" font-size="13.8" font-weight="400" text-anchor="middle">position seen only through q, k</text>
<text x="160" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">learned table stops at the trained length</text>
</g>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. Relative bias</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">Shaw 2018, T5 2019, ALiBi 2021</text>
<g transform="translate(0,40)">
<rect x="380.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="480" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">token</text>
<text x="480" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">embedding only</text>
<path d="M480 452 V420" class="e" marker-end="url(#pos-a)"/>
<rect x="380.0" y="372" width="200" height="48" rx="8" class="b"/>
<text x="480" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">q, k</text>
<text x="480" y="410" class="q" font-size="13.8" font-weight="400" text-anchor="middle">no position inside</text>
<path d="M480 372 V352" class="e" marker-end="url(#pos-a)"/>
<circle cx="480" cy="340" r="12" class="n2"/>
<text x="480" y="345" class="t" font-size="17.2" font-weight="600" text-anchor="middle">+</text>
<rect x="512.0" y="316" width="84" height="48" rx="8" class="n2"/>
<text x="554" y="337" class="t" font-size="16.1" font-weight="600" text-anchor="middle">−m·(i−j)</text>
<text x="554" y="354" class="q" font-size="13.8" font-weight="400" text-anchor="middle">bias</text>
<path d="M512 340 H494" class="e2" marker-end="url(#pos-a)"/>
<rect x="388" y="288" width="8" height="8" class="cell" fill-opacity="0.85"/>
<rect x="388" y="297" width="8" height="8" class="cell" fill-opacity="0.71"/>
<rect x="397" y="297" width="8" height="8" class="cell" fill-opacity="0.85"/>
<rect x="388" y="306" width="8" height="8" class="cell" fill-opacity="0.57"/>
<rect x="397" y="306" width="8" height="8" class="cell" fill-opacity="0.71"/>
<rect x="406" y="306" width="8" height="8" class="cell" fill-opacity="0.85"/>
<rect x="388" y="315" width="8" height="8" class="cell" fill-opacity="0.43"/>
<rect x="397" y="315" width="8" height="8" class="cell" fill-opacity="0.57"/>
<rect x="406" y="315" width="8" height="8" class="cell" fill-opacity="0.71"/>
<rect x="415" y="315" width="8" height="8" class="cell" fill-opacity="0.85"/>
<rect x="388" y="324" width="8" height="8" class="cell" fill-opacity="0.29"/>
<rect x="397" y="324" width="8" height="8" class="cell" fill-opacity="0.43"/>
<rect x="406" y="324" width="8" height="8" class="cell" fill-opacity="0.57"/>
<rect x="415" y="324" width="8" height="8" class="cell" fill-opacity="0.71"/>
<rect x="424" y="324" width="8" height="8" class="cell" fill-opacity="0.85"/>
<rect x="388" y="333" width="8" height="8" class="cell" fill-opacity="0.15"/>
<rect x="397" y="333" width="8" height="8" class="cell" fill-opacity="0.29"/>
<rect x="406" y="333" width="8" height="8" class="cell" fill-opacity="0.43"/>
<rect x="415" y="333" width="8" height="8" class="cell" fill-opacity="0.57"/>
<rect x="424" y="333" width="8" height="8" class="cell" fill-opacity="0.71"/>
<rect x="433" y="333" width="8" height="8" class="cell" fill-opacity="0.85"/>
<text x="415" y="356" class="q" font-size="11.5" font-weight="400" text-anchor="middle">near = small penalty</text>
<path d="M480 328 V272" class="e" marker-end="url(#pos-a)"/>
<rect x="380.0" y="224" width="200" height="48" rx="8" class="b"/>
<text x="480" y="245" class="t" font-size="16.1" font-weight="600" text-anchor="middle">score q·k + bias</text>
<text x="480" y="262" class="q" font-size="13.8" font-weight="400" text-anchor="middle">position only in the bias</text>
<path d="M480 224 V192" class="e" marker-end="url(#pos-a)"/>
<rect x="380.0" y="144" width="200" height="34" rx="8" class="b"/>
<text x="480" y="166" class="t" font-size="16.1" font-weight="600" text-anchor="middle">softmax, weight v</text>
<path d="M480 144 V112" class="e" marker-end="url(#pos-a)"/>
<text x="480" y="104" class="q" font-size="13.8" font-weight="400" text-anchor="middle">values v carry no position</text>
<text x="480" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">depends on i−j, so any length works</text>
</g>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. RoPE</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">Su et al. 2021, scaled 2023</text>
<g transform="translate(0,40)">
<rect x="700.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="800" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">token</text>
<text x="800" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">embedding only</text>
<path d="M800 452 V420" class="e" marker-end="url(#pos-a)"/>
<rect x="700.0" y="372" width="200" height="48" rx="8" class="b"/>
<text x="800" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">q, k</text>
<text x="800" y="410" class="q" font-size="13.8" font-weight="400" text-anchor="middle">pairs of channels</text>
<path d="M800 372 V340" class="e" marker-end="url(#pos-a)"/>
<rect x="700" y="214" width="200" height="124" rx="8" class="n3"/>
<text x="800" y="234" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Rotate by position</text>
<circle cx="748" cy="292" r="38" class="dial"/>
<path d="M748 292 L783.7 279.0" class="vk" marker-end="url(#pos-a3)"/>
<path d="M748 292 L757.8 255.3" class="vq" marker-end="url(#pos-a3)"/>
<path d="M766.8 285.2 A20 20 0 0 0 753.2 272.7" class="arc"/>
<text x="842" y="280" class="q" font-size="12.6" font-weight="400" text-anchor="middle">angle between</text>
<text x="842" y="297" class="t" font-size="13.8" font-weight="600" text-anchor="middle">= (i−j)θ</text>
<text x="842" y="320" class="q" font-size="11.5" font-weight="400" text-anchor="middle">length unchanged</text>
<path d="M800 214 V192" class="e" marker-end="url(#pos-a)"/>
<rect x="700.0" y="144" width="200" height="48" rx="8" class="b"/>
<text x="800" y="165" class="t" font-size="16.1" font-weight="600" text-anchor="middle">score q·k</text>
<text x="800" y="182" class="q" font-size="13.8" font-weight="400" text-anchor="middle">depends on content and i−j</text>
<path d="M800 144 V112" class="e" marker-end="url(#pos-a)"/>
<text x="800" y="104" class="q" font-size="13.8" font-weight="400" text-anchor="middle">then softmax, weight v</text>
<text x="800" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">no parameters; scale θ for longer text</text>
</g>
<rect x="49.2" y="73" width="221.6" height="19" rx="9.5" class="tag1"/>
<text x="160" y="87" class="tagt1" font-size="12.1" font-weight="600" text-anchor="middle">NEW: add a vector for position i</text>
<rect x="372.35" y="73" width="215.29999999999998" height="19" rx="9.5" class="tag2"/>
<text x="480" y="87" class="tagt2" font-size="12.1" font-weight="600" text-anchor="middle">NEW: score bias by distance i−j</text>
<rect x="701.8" y="73" width="196.4" height="19" rx="9.5" class="tag3"/>
<text x="800" y="87" class="tagt3" font-size="12.1" font-weight="600" text-anchor="middle">NEW: rotate q, k by angle iθ</text>
<path d="M320 20 V570" class="sep"/>
<path d="M640 20 V570" class="sep"/>
</svg>
