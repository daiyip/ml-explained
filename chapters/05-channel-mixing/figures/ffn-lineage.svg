<text x="106" y="336" class="q" font-size="12.1" font-weight="400" text-anchor="middle">sigmoid</text>
<text x="166" y="336" class="cl1" font-size="12.1" font-weight="600" text-anchor="middle">ReLU</text>
<text x="218" y="336" class="cl2" font-size="12.1" font-weight="600" text-anchor="middle">GELU</text>
<path d="M160 222 V190" class="e" marker-end="url(#ffn-a)"/>
