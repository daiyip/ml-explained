<text x="160" y="180" class="q" font-size="13.8" font-weight="400" text-anchor="middle">4d to d</text>
<path d="M160 142 V104" class="e" marker-end="url(#ffn-a)"/>
<text x="160" y="96" class="q" font-size="13.8" font-weight="400" text-anchor="middle">output, width d</text>
<text x="160" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">parameters 8d², all used per token</text>
</g>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. SwiGLU</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">a gate decides what passes</text>
<g transform="translate(0,40)">
<rect x="380.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="480" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">x</text>
<text x="480" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">one token, width d</text>
<path d="M480 452 V436 H418 V412" class="e" marker-end="url(#ffn-a)"/>
<path d="M480 436 H542 V412" class="e" marker-end="url(#ffn-a)"/>
<rect x="362.0" y="364" width="112" height="48" rx="8" class="n2"/>
<text x="418" y="385" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Linear gate</text>
<text x="418" y="402" class="q" font-size="13.8" font-weight="400" text-anchor="middle">d to 8d/3</text>
<rect x="486.0" y="364" width="112" height="48" rx="8" class="b"/>
<text x="542" y="385" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Linear up</text>
<text x="542" y="402" class="q" font-size="13.8" font-weight="400" text-anchor="middle">d to 8d/3</text>
<path d="M418 364 V334" class="e" marker-end="url(#ffn-a)"/>
<rect x="362.0" y="286" width="112" height="48" rx="8" class="b"/>
<text x="418" y="307" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Swish</text>
<text x="418" y="324" class="q" font-size="13.8" font-weight="400" text-anchor="middle">smooth ReLU</text>
<path d="M418 286 V242 H466" class="e2" marker-end="url(#ffn-a)"/>
<path d="M542 364 V242 H494" class="e" marker-end="url(#ffn-a)"/>
<circle cx="480" cy="242" r="12" class="n2"/>
<text x="480" y="247" class="t" font-size="17.2" font-weight="600" text-anchor="middle">×</text>
<path d="M480 230 V190" class="e" marker-end="url(#ffn-a)"/>
<rect x="380.0" y="142" width="200" height="48" rx="8" class="b"/>
<text x="480" y="163" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Linear down</text>
<text x="480" y="180" class="q" font-size="13.8" font-weight="400" text-anchor="middle">8d/3 to d</text>
<path d="M480 142 V104" class="e" marker-end="url(#ffn-a)"/>
<text x="480" y="96" class="q" font-size="13.8" font-weight="400" text-anchor="middle">output, width d</text>
<text x="480" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">parameters 8d², the same budget</text>
</g>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. Mixture of Experts</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">many FFNs, each token uses k</text>
<g transform="translate(0,40)">
<rect x="700.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="800" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">x</text>
<text x="800" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">one token, width d</text>
<path d="M800 452 V420" class="e" marker-end="url(#ffn-a)"/>
<rect x="685.0" y="372" width="230" height="48" rx="8" class="n3"/>
<text x="800" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Router</text>
<text x="800" y="410" class="q" font-size="13.8" font-weight="400" text-anchor="middle">scores E experts, keeps top k</text>
<path d="M713 372 V322" class="e3" marker-end="url(#ffn-a)"/>
<rect x="689" y="276" width="48" height="44" rx="8" class="n3"/>
<text x="713" y="296" class="t" font-size="13.8" font-weight="600" text-anchor="middle">FFN1</text>
<text x="713" y="311" class="q" font-size="10.9" font-weight="400" text-anchor="middle">SwiGLU</text>
<path d="M713 276 V242 H786" class="e3" marker-end="url(#ffn-a)"/>
<path d="M771 372 V322" class="ed" marker-end="url(#ffn-a)"/>
<rect x="747" y="276" width="48" height="44" rx="8" class="b off"/>
<text x="771" y="296" class="q" font-size="13.8" font-weight="600" text-anchor="middle">FFN2</text>
<text x="771" y="311" class="q" font-size="10.9" font-weight="400" text-anchor="middle">SwiGLU</text>
<path d="M829 372 V322" class="e3" marker-end="url(#ffn-a)"/>
<rect x="805" y="276" width="48" height="44" rx="8" class="n3"/>
<text x="829" y="296" class="t" font-size="13.8" font-weight="600" text-anchor="middle">FFN3</text>
<text x="829" y="311" class="q" font-size="10.9" font-weight="400" text-anchor="middle">SwiGLU</text>
<path d="M829 276 V242 H814" class="e3" marker-end="url(#ffn-a)"/>
<path d="M887 372 V322" class="ed" marker-end="url(#ffn-a)"/>
<rect x="863" y="276" width="48" height="44" rx="8" class="b off"/>
<text x="887" y="296" class="q" font-size="13.8" font-weight="600" text-anchor="middle">FFN4</text>
<text x="887" y="311" class="q" font-size="10.9" font-weight="400" text-anchor="middle">SwiGLU</text>
<circle cx="800" cy="242" r="12" class="n3"/>
<text x="800" y="247" class="t" font-size="17.2" font-weight="600" text-anchor="middle">Σ</text>
<path d="M800 230 V190" class="e" marker-end="url(#ffn-a)"/>
<rect x="700.0" y="142" width="200" height="48" rx="8" class="b"/>
<text x="800" y="163" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Weighted sum</text>
<text x="800" y="180" class="q" font-size="13.8" font-weight="400" text-anchor="middle">by the router's scores</text>
<path d="M800 142 V104" class="e" marker-end="url(#ffn-a)"/>
<text x="800" y="96" class="q" font-size="13.8" font-weight="400" text-anchor="middle">output, width d</text>
<text x="800" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">parameters E × 8d², compute k × 8d²</text>
</g>
