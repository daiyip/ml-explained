<text x="160" y="87" class="tagt1" font-size="12.1" font-weight="600" text-anchor="middle">NEW: a non-saturating activation</text>
<rect x="372.35" y="73" width="215.29999999999998" height="19" rx="9.5" class="tag2"/>
<text x="480" y="87" class="tagt2" font-size="12.1" font-weight="600" text-anchor="middle">NEW: multiply by a learned gate</text>
<rect x="692.35" y="73" width="215.29999999999998" height="19" rx="9.5" class="tag3"/>
<text x="800" y="87" class="tagt3" font-size="12.1" font-weight="600" text-anchor="middle">NEW: route each token to k of E</text>
