<polyline points="80.0,318.0 84.0,318.0 88.0,318.0 92.0,318.0 96.0,318.0 100.0,318.0 104.0,318.0 108.0,318.0 112.0,318.0 116.0,318.0 120.0,318.0 124.0,318.0 128.0,318.0 132.0,318.0 136.0,318.0 140.0,318.0 144.0,318.0 148.0,318.0 152.0,318.0 156.0,318.0 160.0,318.0 164.0,314.7 168.0,311.4 172.0,308.1 176.0,304.8 180.0,301.5 184.0,298.2 188.0,294.9 192.0,291.6 196.0,288.3 200.0,285.0 204.0,281.7 208.0,278.4 212.0,275.1 216.0,271.8 220.0,268.5 224.0,265.2 228.0,261.9 232.0,258.6 236.0,255.3 240.0,252.0" class="c1"/>
