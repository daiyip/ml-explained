<defs><marker id="ffn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. MLP</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">sigmoid, then ReLU, then GELU</text>
<g transform="translate(0,40)">
<rect x="60.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="160" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">x</text>
<text x="160" y="490" class="q" font-size="13.8" font-weight="400" text-anchor="middle">one token, width d</text>
<path d="M160 452 V420" class="e" marker-end="url(#ffn-a)"/>
<rect x="60.0" y="372" width="200" height="48" rx="8" class="b"/>
<text x="160" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Linear up</text>
<text x="160" y="410" class="q" font-size="13.8" font-weight="400" text-anchor="middle">d to 4d</text>
<path d="M160 372 V346" class="e" marker-end="url(#ffn-a)"/>
<rect x="60" y="222" width="200" height="122" rx="8" class="n1"/>
<text x="160" y="243" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Activation</text>
