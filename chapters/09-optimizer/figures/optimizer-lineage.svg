<svg xmlns="http://www.w3.org/2000/svg" class="opt-fig" viewBox="0 0 960 580" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .opt-fig .t{fill:var(--mlx-ink,#131c27)} .opt-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .opt-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .opt-fig .e,.opt-fig .e2,.opt-fig .e3{fill:none;stroke-width:1.5} .opt-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .opt-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .opt-fig .e3{stroke:var(--mlx-warn,#b5562b)} .opt-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .opt-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .opt-fig .axis{stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.6;stroke-width:1} .opt-fig .ct{fill:none;stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.35;stroke-width:1} .opt-fig .p0{fill:none;stroke:var(--mlx-ink-soft,#4a5868);stroke-width:1.5;stroke-dasharray:3 3} .opt-fig .p1{fill:none;stroke:var(--mlx-accent,#2647c9);stroke-width:2.5;stroke-linecap:round} .opt-fig .dot{fill:var(--mlx-ink,#131c27)} .opt-fig .bar0{fill:var(--mlx-ink-soft,#4a5868);opacity:.45} .opt-fig .bar2{fill:var(--mlx-good,#1f8a5b)} .opt-fig .bar3{fill:var(--mlx-warn,#b5562b)} .opt-fig .n1,.opt-fig .n2,.opt-fig .n3{stroke-width:2} .opt-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .opt-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .opt-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .opt-fig .tag1{fill:var(--mlx-accent,#2647c9)} .opt-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .opt-fig .tag3{fill:var(--mlx-warn,#b5562b)} .opt-fig .tagt1,.opt-fig .tagt2,.opt-fig .tagt3{fill:var(--mlx-paper,#fff)} .opt-fig .cl1{fill:var(--mlx-accent,#2647c9)} .opt-fig .cl2{fill:var(--mlx-good,#1f8a5b)} .opt-fig .cl3{fill:var(--mlx-warn,#b5562b)}
</style>
<defs><marker id="opt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. SGD + momentum</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">one step size for every weight</text>
<rect x="30" y="104" width="260" height="178" rx="8" class="b"/>
<ellipse cx="176" cy="190" rx="25" ry="9" class="ct"/>
<ellipse cx="176" cy="190" rx="50" ry="18" class="ct"/>
<ellipse cx="176" cy="190" rx="78" ry="28" class="ct"/>
<ellipse cx="176" cy="190" rx="104" ry="38" class="ct"/>
<polyline points="68.0,160.0 84.8,217.0 100.4,166.0 115.0,211.0 128.3,172.0 140.4,205.0 151.1,178.0 160.3,199.0 167.8,184.0 173.3,193.0 176.0,190.0" class="p0"/>
<path d="M68 160 C108 216, 148 196, 176 190" class="p1"/>
<circle cx="176" cy="190" r="3.5" class="dot"/>
<text x="84" y="128" class="q" font-size="12.6" font-weight="400" text-anchor="start">SGD: zig-zags</text>
<text x="84" y="272" class="cl1" font-size="12.6" font-weight="600" text-anchor="start">momentum: follows the valley</text>
<rect x="50.0" y="302" width="220" height="48" rx="8" class="b"/>
<text x="160" y="323" class="t" font-size="16.1" font-weight="600" text-anchor="middle">gradient g</text>
<text x="160" y="340" class="q" font-size="13.2" font-weight="400" text-anchor="middle">of the loss, one number per weight</text>
<path d="M160 350 V374" class="e" marker-end="url(#opt-a)"/>
<rect x="50.0" y="376" width="220" height="48" rx="8" class="n1"/>
<text x="160" y="397" class="t" font-size="16.1" font-weight="600" text-anchor="middle">v ← μ v + g</text>
<text x="160" y="414" class="q" font-size="13.2" font-weight="400" text-anchor="middle">a running sum of past gradients</text>
<path d="M160 424 V448" class="e" marker-end="url(#opt-a)"/>
<rect x="50.0" y="450" width="220" height="48" rx="8" class="b"/>
<text x="160" y="471" class="t" font-size="16.1" font-weight="600" text-anchor="middle">w ← w − η v</text>
<text x="160" y="488" class="q" font-size="13.2" font-weight="400" text-anchor="middle">the same η for every weight</text>
<text x="160" y="530" class="q" font-size="14.4" font-weight="400" text-anchor="middle">state: 1 number per weight</text>
<text x="160" y="550" class="q" font-size="14.4" font-weight="400" text-anchor="middle">fast along the valley, if η is tuned</text>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. Adam, AdamW</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">a step size for each weight</text>
<rect x="350" y="104" width="260" height="178" rx="8" class="b"/>
<rect x="376" y="137.1" width="9" height="58.9" class="bar0"/>
<rect x="386" y="157.6" width="9" height="38.4" class="bar2"/>
<rect x="403" y="188.6" width="9" height="7.4" class="bar0"/>
<rect x="413" y="152.6" width="9" height="43.4" class="bar2"/>
<rect x="430" y="161.9" width="9" height="34.1" class="bar0"/>
<rect x="440" y="158.8" width="9" height="37.2" class="bar2"/>
<rect x="457" y="192.9" width="9" height="3.1" class="bar0"/>
<rect x="467" y="162.2" width="9" height="33.8" class="bar2"/>
<rect x="484" y="149.5" width="9" height="46.5" class="bar0"/>
<rect x="494" y="155.1" width="9" height="40.9" class="bar2"/>
<rect x="511" y="180.5" width="9" height="15.5" class="bar0"/>
<rect x="521" y="153.6" width="9" height="42.4" class="bar2"/>
<rect x="538" y="171.2" width="9" height="24.8" class="bar0"/>
<rect x="548" y="161.0" width="9" height="35.0" class="bar2"/>
<rect x="565" y="191.0" width="9" height="5.0" class="bar0"/>
<rect x="575" y="160.6" width="9" height="35.4" class="bar2"/>
<path d="M368 196 H592" class="axis"/>
<text x="480" y="216" class="q" font-size="12.6" font-weight="400" text-anchor="middle">eight weights</text>
<rect x="376" y="234" width="10" height="10" class="bar0"/>
<text x="392" y="243" class="q" font-size="12.6" font-weight="400" text-anchor="start">raw gradient</text>
<rect x="486" y="234" width="10" height="10" class="bar2"/>
<text x="502" y="243" class="cl2" font-size="12.6" font-weight="600" text-anchor="start">Adam step</text>
<text x="480" y="270" class="q" font-size="12.6" font-weight="400" text-anchor="middle">small gradients get bigger steps</text>
<rect x="370.0" y="302" width="220" height="48" rx="8" class="b"/>
<text x="480" y="323" class="t" font-size="16.1" font-weight="600" text-anchor="middle">gradient g</text>
<text x="480" y="340" class="q" font-size="13.2" font-weight="400" text-anchor="middle">of the loss, one number per weight</text>
<path d="M424 350 V374" class="e" marker-end="url(#opt-a)"/>
<path d="M536 350 V374" class="e" marker-end="url(#opt-a)"/>
<rect x="370.0" y="376" width="108" height="48" rx="8" class="b"/>
<text x="424" y="397" class="t" font-size="16.1" font-weight="600" text-anchor="middle">m ← avg g</text>
<text x="424" y="414" class="q" font-size="13.2" font-weight="400" text-anchor="middle">direction</text>
<rect x="482.0" y="376" width="108" height="48" rx="8" class="n2"/>
<text x="536" y="397" class="t" font-size="16.1" font-weight="600" text-anchor="middle">s ← avg g²</text>
<text x="536" y="414" class="q" font-size="13.2" font-weight="400" text-anchor="middle">scale</text>
<path d="M424 424 V448" class="e" marker-end="url(#opt-a)"/>
<path d="M536 424 V448" class="e2" marker-end="url(#opt-a)"/>
<rect x="370.0" y="450" width="220" height="48" rx="8" class="n2"/>
<text x="480" y="471" class="t" font-size="16.1" font-weight="600" text-anchor="middle">w ← w − η m / √s</text>
<text x="480" y="488" class="q" font-size="13.2" font-weight="400" text-anchor="middle">AdamW: also w ← w − ηλw</text>
<text x="480" y="530" class="q" font-size="14.4" font-weight="400" text-anchor="middle">state: 2 numbers per weight</text>
<text x="480" y="550" class="q" font-size="14.4" font-weight="400" text-anchor="middle">decay kept outside the scaling</text>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. Muon</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">treat each weight matrix as a whole</text>
<rect x="670" y="104" width="260" height="178" rx="8" class="b"/>
<rect x="684.0" y="134.0" width="9" height="62.0" class="bar0"/>
<rect x="697.5" y="161.9" width="9" height="34.1" class="bar0"/>
<rect x="711.0" y="177.4" width="9" height="18.6" class="bar0"/>
<rect x="724.5" y="185.5" width="9" height="10.5" class="bar0"/>
<rect x="738.0" y="189.8" width="9" height="6.2" class="bar0"/>
<rect x="751.5" y="192.3" width="9" height="3.7" class="bar0"/>
<rect x="765.0" y="193.5" width="9" height="2.5" class="bar0"/>
<rect x="778.5" y="194.1" width="9" height="1.9" class="bar0"/>
<path d="M682 196 H792" class="axis"/>
<rect x="808.0" y="142.7" width="9" height="53.3" class="bar3"/>
<rect x="821.5" y="137.1" width="9" height="58.9" class="bar3"/>
<rect x="835.0" y="134.0" width="9" height="62.0" class="bar3"/>
<rect x="848.5" y="131.5" width="9" height="64.5" class="bar3"/>
<rect x="862.0" y="135.9" width="9" height="60.1" class="bar3"/>
<rect x="875.5" y="140.2" width="9" height="55.8" class="bar3"/>
<rect x="889.0" y="143.9" width="9" height="52.1" class="bar3"/>
<rect x="902.5" y="146.4" width="9" height="49.6" class="bar3"/>
<path d="M806 196 H916" class="axis"/>
<text x="738" y="216" class="q" font-size="12.6" font-weight="400" text-anchor="middle">momentum M</text>
<text x="862" y="216" class="cl3" font-size="12.6" font-weight="600" text-anchor="middle">update O</text>
<text x="800" y="243" class="q" font-size="12.6" font-weight="400" text-anchor="middle">singular values of the matrix</text>
<text x="800" y="270" class="q" font-size="12.6" font-weight="400" text-anchor="middle">every direction moves equally</text>
<rect x="690.0" y="302" width="220" height="48" rx="8" class="b"/>
<text x="800" y="323" class="t" font-size="16.1" font-weight="600" text-anchor="middle">gradient matrix G</text>
<text x="800" y="340" class="q" font-size="13.2" font-weight="400" text-anchor="middle">for each 2-D weight W</text>
<path d="M800 350 V374" class="e" marker-end="url(#opt-a)"/>
<rect x="690.0" y="376" width="220" height="48" rx="8" class="n3"/>
<text x="800" y="397" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Newton-Schulz on M</text>
<text x="800" y="414" class="q" font-size="13.2" font-weight="400" text-anchor="middle">U Σ Vᵀ becomes U Vᵀ</text>
<path d="M800 424 V448" class="e3" marker-end="url(#opt-a)"/>
<rect x="690.0" y="450" width="220" height="48" rx="8" class="b"/>
<text x="800" y="471" class="t" font-size="16.1" font-weight="600" text-anchor="middle">W ← W − η O</text>
<text x="800" y="488" class="q" font-size="13.2" font-weight="400" text-anchor="middle">same rotation, flat spectrum</text>
<text x="800" y="530" class="q" font-size="14.4" font-weight="400" text-anchor="middle">state: 1 number per weight</text>
<text x="800" y="550" class="q" font-size="14.4" font-weight="400" text-anchor="middle">AdamW still handles vectors</text>
<rect x="55.5" y="73" width="209.0" height="19" rx="9.5" class="tag1"/>
<text x="160" y="87" class="tagt1" font-size="12.1" font-weight="600" text-anchor="middle">NEW: a velocity that remembers</text>
<rect x="381.8" y="73" width="196.4" height="19" rx="9.5" class="tag2"/>
<text x="480" y="87" class="tagt2" font-size="12.1" font-weight="600" text-anchor="middle">NEW: divide by a running RMS</text>
<rect x="698.65" y="73" width="202.7" height="19" rx="9.5" class="tag3"/>
<text x="800" y="87" class="tagt3" font-size="12.1" font-weight="600" text-anchor="middle">NEW: orthogonalize the update</text>
<path d="M320 20 V560" class="sep"/>
<path d="M640 20 V560" class="sep"/>
</svg>
