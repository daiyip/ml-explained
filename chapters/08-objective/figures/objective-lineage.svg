<text x="480" y="286" class="cl2" font-size="12.6" font-weight="600" text-anchor="middle">next-token targets: every position</text>
<rect x="355.0" y="222" width="250" height="34" rx="8" class="b"/>
<text x="480" y="244" class="t" font-size="14.9" font-weight="600" text-anchor="middle">loss = −log p(true next token)</text>
<path d="M350 204 H610" class="sep"/>
<text x="480" y="128" class="q" font-size="13.2" font-weight="600" text-anchor="middle">masked variant (BERT)</text>
<rect x="367.0" y="140" width="34" height="30" rx="6" class="b off"/>
<text x="384" y="160" class="t" font-size="14.9" font-weight="600" text-anchor="middle">T</text>
<rect x="415.0" y="140" width="34" height="30" rx="6" class="b off"/>
<text x="432" y="160" class="t" font-size="14.9" font-weight="600" text-anchor="middle">o</text>
<rect x="460.0" y="140" width="40" height="30" rx="6" class="n2"/>
<text x="480" y="160" class="t" font-size="14.9" font-weight="600" text-anchor="middle">[M]</text>
