<text x="480" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Causal Transformer</text>
<text x="480" y="410" class="q" font-size="13.2" font-weight="400" text-anchor="middle">each position sees only the past</text>
<path d="M384 372 V332" class="e2" marker-end="url(#obj-a)"/>
<rect x="367.0" y="300" width="34" height="30" rx="6" class="n2"/>
