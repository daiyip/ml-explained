<svg xmlns="http://www.w3.org/2000/svg" class="obj-fig" viewBox="0 0 960 600" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style> .obj-fig .t{fill:var(--mlx-ink,#131c27)} .obj-fig .q{fill:var(--mlx-ink-soft,#4a5868)} .obj-fig .b{fill:var(--mlx-panel,#fff);stroke:var(--mlx-ink-soft,#4a5868);stroke-opacity:.45;stroke-width:1.25} .obj-fig .off{opacity:.55} .obj-fig .e,.obj-fig .e2,.obj-fig .e3{fill:none;stroke-width:1.5} .obj-fig .e{stroke:var(--mlx-ink-soft,#4a5868)} .obj-fig .e2{stroke:var(--mlx-good,#1f8a5b)} .obj-fig .e3{stroke:var(--mlx-warn,#b5562b)} .obj-fig .ah{fill:var(--mlx-ink-soft,#4a5868)} .obj-fig .sep{stroke:var(--mlx-rule,#d3dae3);stroke-dasharray:2 5} .obj-fig .n1,.obj-fig .n2,.obj-fig .n3{stroke-width:2} .obj-fig .n1{fill:rgba(38,71,201,.08);fill:color-mix(in srgb,var(--mlx-accent,#2647c9) 12%,transparent);stroke:var(--mlx-accent,#2647c9)} .obj-fig .n2{fill:rgba(31,138,91,.08);fill:color-mix(in srgb,var(--mlx-good,#1f8a5b) 14%,transparent);stroke:var(--mlx-good,#1f8a5b)} .obj-fig .n3{fill:rgba(181,86,43,.08);fill:color-mix(in srgb,var(--mlx-warn,#b5562b) 14%,transparent);stroke:var(--mlx-warn,#b5562b)} .obj-fig .bar0{fill:var(--mlx-ink-soft,#4a5868);opacity:.45} .obj-fig .bar1{fill:var(--mlx-accent,#2647c9)} .obj-fig .tag1{fill:var(--mlx-accent,#2647c9)} .obj-fig .tag2{fill:var(--mlx-good,#1f8a5b)} .obj-fig .tag3{fill:var(--mlx-warn,#b5562b)} .obj-fig .tagt1,.obj-fig .tagt2,.obj-fig .tagt3{fill:var(--mlx-paper,#fff)} .obj-fig .cl1{fill:var(--mlx-accent,#2647c9)} .obj-fig .cl2{fill:var(--mlx-good,#1f8a5b)} .obj-fig .cl3{fill:var(--mlx-warn,#b5562b)}
</style>
<defs><marker id="obj-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="160" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">1. Supervised</text>
<text x="160" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">AlexNet, 2012: learn from labels</text>
<g transform="translate(0,40)">
<rect x="60.0" y="452" width="200" height="48" rx="8" class="b"/>
<text x="160" y="473" class="t" font-size="16.1" font-weight="600" text-anchor="middle">x</text>
<text x="160" y="490" class="q" font-size="13.2" font-weight="400" text-anchor="middle">an image</text>
<path d="M160 452 V420" class="e" marker-end="url(#obj-a)"/>
<rect x="60.0" y="372" width="200" height="48" rx="8" class="b"/>
<text x="160" y="393" class="t" font-size="16.1" font-weight="600" text-anchor="middle">Network</text>
<text x="160" y="410" class="q" font-size="13.2" font-weight="400" text-anchor="middle">pixels to K class scores</text>
<path d="M160 372 V346" class="e" marker-end="url(#obj-a)"/>
<rect x="50" y="196" width="220" height="148" rx="8" class="n1"/>
<text x="160" y="216" class="t" font-size="14.9" font-weight="600" text-anchor="middle">softmax over classes</text>
<rect x="68" y="256.2" width="24" height="55.8" rx="2" class="bar1"/>
<text x="80" y="330" class="cl1" font-size="12.1" font-weight="600" text-anchor="middle">cat</text>
<rect x="108" y="292.2" width="24" height="19.8" rx="2" class="bar0"/>
<text x="120" y="330" class="q" font-size="12.1" font-weight="400" text-anchor="middle">dog</text>
<rect x="148" y="306.6" width="24" height="5.3999999999999995" rx="2" class="bar0"/>
<text x="160" y="330" class="q" font-size="12.1" font-weight="400" text-anchor="middle">car</text>
<rect x="188" y="305.7" width="24" height="6.300000000000001" rx="2" class="bar0"/>
<text x="200" y="330" class="q" font-size="12.1" font-weight="400" text-anchor="middle">ship</text>
<rect x="228" y="309.3" width="24" height="2.6999999999999997" rx="2" class="bar0"/>
<text x="240" y="330" class="q" font-size="12.1" font-weight="400" text-anchor="middle">bird</text>
<text x="80" y="250" class="cl1" font-size="12.1" font-weight="600" text-anchor="middle">label</text>
<path d="M160 196 V166" class="e" marker-end="url(#obj-a)"/>
<rect x="50.0" y="118" width="220" height="48" rx="8" class="b"/>
<text x="160" y="139" class="t" font-size="16.1" font-weight="600" text-anchor="middle">loss = −log p(cat)</text>
<text x="160" y="156" class="q" font-size="13.2" font-weight="400" text-anchor="middle">push the label's share up</text>
<text x="160" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">needs a human label per example</text>
</g>
<text x="480" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">2. Self-supervised</text>
<text x="480" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">word2vec, GPT, BERT</text>
<g transform="translate(0,40)">
<rect x="367.0" y="462" width="34" height="30" rx="6" class="b"/>
<text x="384" y="482" class="t" font-size="14.9" font-weight="600" text-anchor="middle">T</text>
