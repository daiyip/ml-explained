<text x="528" y="160" class="t" font-size="14.9" font-weight="600" text-anchor="middle">b</text>
<rect x="559.0" y="140" width="34" height="30" rx="6" class="b off"/>
<text x="576" y="160" class="t" font-size="14.9" font-weight="600" text-anchor="middle">e</text>
<text x="480" y="192" class="q" font-size="12.6" font-weight="400" text-anchor="middle">hide 15%, predict them from both sides</text>
<text x="480" y="520" class="q" font-size="14.4" font-weight="400" text-anchor="middle">free labels, trillions of them</text>
</g>
<text x="800" y="36" class="t" font-size="19.5" font-weight="700" text-anchor="middle">3. Generative, contrastive</text>
<text x="800" y="57" class="q" font-size="14.9" font-weight="400" text-anchor="middle">diffusion 2020, CLIP 2021</text>
<g transform="translate(0,40)">
<text x="725" y="184" class="cl3" font-size="13.8" font-weight="700" text-anchor="middle">diffusion</text>
<text x="870" y="184" class="cl3" font-size="13.8" font-weight="700" text-anchor="middle">CLIP</text>
